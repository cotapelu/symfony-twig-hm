# Import-linter configuration for Kotlin backend
# Enforces layered architecture: Api -> Application -> Domain -> Infrastructure
# Shared packages can be used by any layer.

root_package: kotlin/src/main/kotlin

layers:
  - name: Api
    packages:
      - com.*.controller
      - com.*.handler
      - com.*.routes
  - name: Application
    packages:
      - com.*.service
      - com.*.usecase
  - name: Domain
    packages:
      - com.*.model
      - com.*.domain
      - com.*.entity
  - name: Infrastructure
    packages:
      - com.*.repository
      - com.*.data
  - name: Shared
    packages:
      - com.*.errors
      - com.*.util
      - com.*.extension
      - com.*.extensions

rules:
  - from: Api
    to: [Application, Domain, Infrastructure, Shared]
    imports: allowed
  - from: Application
    to: [Domain, Infrastructure, Shared]
    imports: allowed
  - from: Domain
    to: [Domain, Shared]
    imports: allowed
  - from: Infrastructure
    to: [Domain, Shared]
    imports: allowed
  - from: Shared
    to: [Shared, Domain]
    imports: allowed

  - from: *
    to: *
    imports: disallowed
