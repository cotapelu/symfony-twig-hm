# Digital Wallet API
api_wallet_create:
    path: /api/wallet/create
    controller: App\DigitalWallet\Controller\DigitalWalletController::createWallet
    methods: [POST]

api_wallet_deposit:
    path: /api/wallet/{walletId}/deposit
    controller: App\DigitalWallet\Controller\DigitalWalletController::deposit
    requirements:
        walletId: \\d+
    methods: [POST]

api_wallet_withdraw:
    path: /api/wallet/{walletId}/withdraw
    controller: App\DigitalWallet\Controller\DigitalWalletController::withdraw
    requirements:
        walletId: \\d+
    methods: [POST]

api_wallet_transfer:
    path: /api/wallet/{fromWalletId}/transfer
    controller: App\DigitalWallet\Controller\DigitalWalletController::transfer
    requirements:
        fromWalletId: \\d+
    methods: [POST]

api_wallet_balance:
    path: /api/wallet/{walletId}/balance
    controller: App\DigitalWallet\Controller\DigitalWalletController::getBalance
    requirements:
        walletId: \\d+
    methods: [GET]

api_wallet_transactions:
    path: /api/wallet/{walletId}/transactions
    controller: App\DigitalWallet\Controller\DigitalWalletController::getTransactions
    requirements:
        walletId: \\d+
    methods: [GET]

