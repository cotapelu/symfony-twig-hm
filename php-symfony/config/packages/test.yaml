framework:
    test: true
    csrf_protection: false
    cache:
        app: cache.adapter.array
        system: cache.adapter.array
        pools:
            cache.rate_limit:
                adapter: cache.adapter.array
            cache.app_pool:
                adapter: cache.adapter.array
            cache.system_pool:
                adapter: cache.adapter.array
            test.cache:
                adapter: cache.adapter.array
            redis_cache: null
