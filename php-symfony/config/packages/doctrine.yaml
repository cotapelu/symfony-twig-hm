doctrine:
  dbal:
    default_connection: default
    connections:
      default:
        driver: pdo_pgsql
        host: '%env(DATABASE_HOST)%'
        port: '%env(DATABASE_PORT)%'
        dbname: '%env(DATABASE_NAME)%'
        user: '%env(DATABASE_USER)%'
        password: '%env(DATABASE_PASSWORD)%'
        charset: UTF8
        server_version: '%env(DATABASE_VERSION)%'
        mapping_types:
          json: jsonb
          uuid: string
      read_only:
        driver: pdo_pgsql
        host: '%env(DATABASE_HOST)%'
        port: '%env(DATABASE_PORT)%'
        dbname: '%env(DATABASE_NAME)%'
