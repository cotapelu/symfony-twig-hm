[package]
name = "phuongxa-rust"
version = "0.1.0"
edition = "2021"
authors = ["PhuongXa Team"]
description = "Phuong Xa Super App - Rust Backend"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
futures = "0.3"

# Error handling
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
tokio-test = "0.4"
assert-json-diff = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
