version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/php-symfony"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "backend-team"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "frontend-team"
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "go-team"
  - package-ecosystem: "python"
    directory: "/python"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "python-team"
