# Go Static Analysis Configuration
name: Static Analysis

# Tools to install
tools:
  - golangci-lint: 'golangci-lint@v1.55.0'
  - golangci-misspell: 'golangci-misspell@latest'
  - golangci-vet: 'golangci-vet@v1.55.0'
  - golangci-ineffassign: 'golangci-ineffassign@latest'
  - golangci-gosec: 'golangci-gosec@v1.6.0'
  - golangci-gocyclo: 'golangci-gocyclo@latest'
  - golangci-nlinter: 'golangci-nlinter@v1.55.0'
  - golangci-efficiency: 'golangci-efficiency@latest'
  - golangci-complexity: 'golangci-complexity@latest'
  - golangci-cyclo: 'golangci-cyclo@latest'

# Configuration
configuration:
  golangci:
    run:
      timeout: '10m'
      tests:
        timeout: '5m'
      enable-all: true
      skip-dirs:
        - vendor
        - .git
        - node_modules
    
    settings:
      skip-dirs:
        - vendor
        - .git
        - node_modules
      timeout: '10m'
      max-issues-per-linter: 50
      max-same-issues: 3
      max-issues-per-run: 0
      
      # Custom rules
      linters:
        enable:
          - gosec
          - goconst
          - gocyclo
          - govet
          - staticcheck
          - ineffassign
          - misspell
          - unconvert
          - unparam
          - unused
          - varcheck
          - goimports
          - gocritic
        
        custom:
          # Rule: enforce module dependency
            rule: 'module-import'
            path: 'src/Module'
            message: 'Only direct module imports allowed in Module layer'
            
          # Rule: enforce layer isolation
            rule: 'no-cross-module'
            path: 'src/Controller'
            message: 'Controllers cannot depend on other controllers'
            
          # Rule: enforce clean architecture
            rule: 'arch-unit'
            path: 'src/'
            message: 'Architecture packages should be clean'
            
          # Rule: enforce error handling
            rule: 'errorf'
            message: 'Errors should be properly handled'

# Check configuration
checks:
  - name: Check code complexity
    run: |
      go list -f . -json='{ "Type": "complexity", "Size": "300", "Cyclomatic": "15"}' ./...

  - name: Check for security vulnerabilities
    run: |
      go list -f . -json='{ "Type": "security", "Mode": "binary", "Output": "json" }' ./...

  - name: Check for performance issues
    run: |
      go list -f . -json='{ "Type": "performance", "Mode": "complexity", "Threshold": "10" }' ./...

  - name: Check for code quality
    run: |
      go list -f . -json='{ "Type": "maintainability", "Mode": "complexity", "Threshold": "8" }' ./...

  - name: Check for proper imports
    run: |
      go list -f . -json='{ "Type": "imports", "Mode": "complexity", "Threshold": "5" }' ./...

  # Name: Run all checks
    run: |
      make analyze
    timeout: '20m'