name: Mutation Testing (Python)

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      INTEGRATION_TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      JWT_SECRET_KEY: test-secret
      JWT_ALGORITHM: HS256
      OPENAI_API_KEY: ""  # Disable OpenAI for deterministic tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements-test.txt'
      
      - name: Install dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run mutmut (mutation testing)
        working-directory: ./python
        run: |
          # First, ensure tests pass without mutation
          pytest tests/unit tests/integration -q --tb=short
          # Run mutation testing on unit + integration tests
          mutmut run --paths-to-mute app --test-command "pytest tests/unit tests/integration -q --mutmut" || true
      
      - name: Generate mutmut HTML report
        working-directory: ./python
        run: |
          mutmut html
        continue-on-error: true
      
      - name: Upload mutation results
        uses: actions/upload-artifact@v3
        with:
          name: mutmut-report
          path: |
            python/mutmut/
            python/htmlcov/mutmut.html
          retention-days: 7
      
      - name: Check mutation score
        working-directory: ./python
        run: |
          SCORE=$(mutmut stats | grep 'total' | awk '{print $4}' | sed 's/%//')
          echo "Mutation score: $SCORE%"
          if (( $(echo "$SCORE < 70" | bc -l) )); then
            echo "Mutation score below 70% – improve test quality."
            exit 1
          fi
        shell: /usr/bin/bash -e {0}
        continue-on-error: true
