name: OpenAPI Contract Check

on:
  pull_request:
    paths:
      - 'go/cmd/api/openapi.yaml'

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to compare with base

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenAPI CLI
        run: npm install -g @redocly/openapi-cli

      - name: Check for breaking changes
        run: |
          git fetch origin main
          git checkout origin/main -- go/cmd/api/openapi.yaml || true
          BASELINE=./go/cmd/api/openapi.yaml
          CURRENT=./go/cmd/api/openapi.yaml
          # Ensure baseline file exists; if not, use empty?
          if [ ! -s "$BASELINE" ]; then
            echo "Baseline missing, skipping"
            exit 0
          fi
          echo "Comparing baseline (main) with current PR version"
          openapi diff --source "$CURRENT" --base "$BASELINE"
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Breaking changes detected in OpenAPI spec. Please update clients accordingly and follow versioning policy."
            exit 1
          fi
          echo "No breaking changes."
