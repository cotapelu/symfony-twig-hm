name: CI - Go Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        working-directory: ./go
        run: go mod download
      
      - name: Run tests
        working-directory: ./go
        run: |
          export DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db?sslmode=disable
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run integration tests
        working-directory: ./go
        env:
          INTEGRATION_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?sslmode=disable
        run: |
          go test -tags=integration -v ./modules/...
      
      - name: Check coverage threshold
        working-directory: ./go
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Go test coverage: ${COVERAGE}%"
          # Fail if coverage < 80%
          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "Coverage is below 25% (actual: ${COVERAGE}%)"
            exit 1
          fi
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./go/coverage.txt
          flags: go
          name: go-coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: ./go
          version: latest
          args: --timeout=5m

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version: '1.23'
          working-directory: ./go
