[project]
name = "phuongxa-python"
version = "0.1.0"
description = "Phuong Xa Super App - Python Backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.19.0",
    "opentelemetry-sdk>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "mypy>=1.7.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "import-linter>=1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.mutmut]
paths_to_mutate = ["app"]
exclude = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/test_*.py",
    "*conftest.py",
    "app/modules/botautomation/*",
]
workers = 4
backup = false
enable_coverage = true
test_command = ["pytest", "--no-cov"]
timeout = 300

[tool.mutmut.config]
mutators = ["all"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests/unit", "modules"]
python_files = ["test_*.py"]
addopts = "--cov --cov-report=xml --cov-report=html --cov-fail-under=50 --ignore=tests/integration"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["modules", "internal"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ .__main__.:",
]

# Import Linter configuration - Architecture enforcement
[tool.importlinter]
# Treat violations as errors
TreatViolationsAsErrors = true

# Define layer boundaries for each module
[tool.importlinter.contracts]
# Example for a module named "Messaging":
# Messaging.Api -> Messaging.Application: true
# Messaging.Api -> Messaging.Domain: false
# Messaging.Application -> Messaging.Domain: true
# Messaging.Application -> Messaging.Infrastructure: false
# Messaging.Domain -> Messaging.Application: false
# Messaging.Domain -> Messaging.Infrastructure: false
# Messaging.Infrastructure -> Messaging.Domain: true

# Pattern for all modules: apply same contract
"*.Api -> *.Application" = true
"*.Api -> *.Domain" = true
"*.Api -> *.Infrastructure" = false
"*.Api -> *.Api" = false  # No cross-module Api

"*.Application -> *.Domain" = true
"*.Application -> *.Infrastructure" = false
"*.Application -> *.Application" = false

"*.Domain -> *.Domain" = true
"*.Domain -> *.Application" = false
"*.Domain -> *.Infrastructure" = false
"*.Domain -> *.Api" = false

"*.Infrastructure -> *.Domain" = true
"*.Infrastructure -> *.Application" = false
"*.Infrastructure -> *.Infrastructure" = false

[tool.importlinter.exceptions]
# Allow module self-imports (circular within module ok)
"*.Api -> *.Api" = "allow"

# Allow test imports
tests = ["tests.*"]

# Legacy modules that are not yet compliant - list here temporarily
# "LegacyModule.*" = ["allow_cross_module"]
