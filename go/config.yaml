server:
  host: "0.0.0.0"
  port: 8081
  mode: "debug"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

kafka:
  brokers:
    - "localhost:9092"
  topics:
    events: "events"
    notifications: "notifications"
    messages: "messages"

rabbitmq:
  host: "localhost"
  port: 5672
  # WARNING: Change default credentials in production!
  username: "guest"
  password: "guest"
  vhost: "/"

log:
  level: "info"
  format: "json"
  output: "stdout"
